name: Refresh public REIT data
on:
  schedule:
    - cron: '35 0,1,2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-reits-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check public snapshot freshness
        id: freshness
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from scripts.validate_public_data import validate
          due = True
          try:
              data = json.loads(Path('data/public_reits.json').read_text())
              validate(data)
              now = datetime.now(ZoneInfo('Asia/Shanghai'))
              times = [datetime.fromisoformat(s['collected_at']) for s in data['source_status'].values()]
              due = not (data['date'] == now.date().isoformat() and times and all(t.tzinfo and t <= now and t.astimezone(now.tzinfo).date() == now.date() for t in times))
          except (OSError, ValueError, KeyError, TypeError):
              pass
          print('due=' + str(due or os.environ['FORCE_REFRESH'] == 'true').lower())
          PY
      - name: Collect and validate all official sources
        if: steps.freshness.outputs.due == 'true'
        run: |
          python -m unittest discover -s tests -q
          python -m collectors.public_reits
          python scripts/validate_public_data.py data/public_reits.json
      - name: Commit complete public data
        if: steps.freshness.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public_reits.json data/raw/public/ data/source_manifest/public/ workpapers/public/ snapshots/public/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public REIT fund and filing library"
            git pull --rebase origin main
            git push
          fi
      - name: Keep source and audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-reits-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/public/
            data/source_manifest/public/
            workpapers/public/
          retention-days: 30
