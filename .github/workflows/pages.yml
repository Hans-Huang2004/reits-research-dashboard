name: Publish REITs project library to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh all REIT data, Refresh NDRC recommendations]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # A failed collection may have committed a safe failed-attempt notice while
    # preserving complete data. The normal validators still gate publication.
    if: ${{ github.event_name != 'workflow_run' || contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.publication.outputs.due }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check whether the completed batch is already live
        id: publication
        env:
          FROM_REFRESH: ${{ github.event_name == 'workflow_run' }}
        run: |
          if [ "$FROM_REFRESH" = true ]; then
            python scripts/pages_due.py --site-url 'https://hans-huang2004.github.io/reits-research-dashboard/' >> "$GITHUB_OUTPUT"
          else
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate and build
        if: steps.publication.outputs.due == 'true'
        run: |
          python -m unittest discover -s tests -q
          python scripts/validate_data.py data/institutional.json
          python scripts/validate_public_data.py data/public_reits.json
          python scripts/validate_ndrc_data.py data/ndrc_recommendations.json --public-input data/public_reits.json --allow-stale-public
          python scripts/project_updates.py --check
          python scripts/build_static.py
      - uses: actions/configure-pages@v5
        if: steps.publication.outputs.due == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.publication.outputs.due == 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
