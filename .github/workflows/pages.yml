name: Publish REITs project library to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      check_freshness:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # A failed collection may have committed a safe failed-attempt notice while
    # preserving complete data. The normal validators still gate publication.
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.publication.outputs.due }}
      source_sha: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Record exact publication commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check whether the completed batch is already live
        id: publication
        env:
          FROM_REFRESH: ${{ inputs.check_freshness }}
        run: |
          if [ "$FROM_REFRESH" = true ]; then
            python scripts/pages_due.py --site-url 'https://hans-huang2004.github.io/reits-research-dashboard/' >> "$GITHUB_OUTPUT"
          else
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate and build
        if: steps.publication.outputs.due == 'true'
        run: |
          python scripts/check_project.py
          python scripts/build_static.py
      - uses: actions/configure-pages@v5
        if: steps.publication.outputs.due == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.publication.outputs.due == 'true'
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify published data against the built commit
        run: python scripts/verify_live.py --site-url 'https://hans-huang2004.github.io/reits-research-dashboard/'
      - name: Keep publication verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-verification-${{ github.run_id }}
          path: live-verification.json
          retention-days: 30
