name: Refresh all REIT data
on:
  schedule:
    # UTC: 05:37–07:52 Beijing, then every 15 minutes at 08:07–11:52.
    # Start before the 08:00 reading time; skip once today's pair is complete.
    - cron: '37,52 21-23 * * *'
    - cron: '7,22,37,52 0-3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-data.yml
      - scripts/refresh_all.py
      - scripts/project_updates.py
      - collectors/**
      - tests/**
      - scripts/validate*.py
permissions:
  contents: write
  actions: read
jobs:
  refresh:
    concurrency:
      group: reits-daily-refresh
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Record cloud scheduler state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          printf 'event=%s schedule=%s\n' "$TRIGGER_EVENT" "$TRIGGER_SCHEDULE"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update-data.yml" --jq '{id, path, state, updated_at}'
      - name: Check whether today's joint batch is complete
        id: freshness
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE_REFRESH" = true ]; then
            python scripts/refresh_all.py --check-only --force >> "$GITHUB_OUTPUT"
          else
            python scripts/refresh_all.py --check-only >> "$GITHUB_OUTPUT"
          fi
      - name: Offline checks
        if: steps.freshness.outputs.due == 'true'
        run: python -m unittest discover -s tests -q
      - name: Collect public and institutional REITs together
        id: collection
        if: steps.freshness.outputs.due == 'true'
        continue-on-error: true
        env:
          REITS_HTTP_TRANSPORT: curl-ipv4
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE_REFRESH" = true ]; then
            python scripts/refresh_all.py --run-id '${{ github.run_id }}-${{ github.run_attempt }}' --force
          else
            python scripts/refresh_all.py --run-id '${{ github.run_id }}-${{ github.run_attempt }}'
          fi
      - name: Build reviewed project updates after the complete pair
        if: steps.freshness.outputs.due == 'true'
        run: python scripts/project_updates.py
      - name: Commit the complete pair or the failed attempt status
        if: steps.freshness.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/institutional.json data/public_reits.json data/refresh_status.json data/project_updates.json data/raw/daily_refresh/ data/source_manifest/ workpapers/daily_refresh/ workpapers/project_updates/ snapshots/public/
          if ! git diff --cached --quiet; then
            if [ '${{ steps.collection.outcome }}' = success ]; then
              git commit -m "data: refresh public and institutional REITs together"
            else
              git commit -m "data: retain complete REIT snapshots and record failed attempt"
            fi
            git pull --rebase origin main
            python scripts/project_updates.py
            git add data/project_updates.json data/source_manifest/project_updates/ workpapers/project_updates/
            if ! git diff --cached --quiet; then
              git commit -m "data: reconcile project updates with current branch inputs"
            fi
            git push
          fi
      - name: Keep source evidence and validation even after failure
        if: always() && steps.freshness.outputs.due == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reits-daily-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/daily_refresh/${{ github.run_id }}-${{ github.run_attempt }}/
            workpapers/daily_refresh/${{ github.run_id }}-${{ github.run_attempt }}/
            data/source_manifest/daily_refresh/${{ github.run_id }}-${{ github.run_attempt }}.json
            data/source_manifest/project_updates/
            workpapers/project_updates/
          retention-days: 30
      - name: Report the failed collection after preserving the last complete data
        if: steps.collection.outcome == 'failure'
        run: exit 1
  recommendations:
    needs: refresh
    uses: ./.github/workflows/ndrc-data.yml
    with:
      skip_publication: true
    permissions:
      contents: write
      pages: write
      id-token: write
  publish:
    needs: [refresh, recommendations]
    if: ${{ always() && !cancelled() && contains(fromJSON('["success", "failure"]'), needs.refresh.result) }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
