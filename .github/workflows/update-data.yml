name: Refresh all REIT data
on:
  schedule:
    # 08:30 Beijing; 09:30 and 10:30 retry only if the joint batch is incomplete.
    - cron: '30 0,1,2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-data.yml
      - scripts/refresh_all.py
permissions:
  contents: write
concurrency:
  group: reits-daily-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check whether today's joint batch is complete
        id: freshness
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE_REFRESH" = true ]; then
            python scripts/refresh_all.py --check-only --force >> "$GITHUB_OUTPUT"
          else
            python scripts/refresh_all.py --check-only >> "$GITHUB_OUTPUT"
          fi
      - name: Offline checks
        if: steps.freshness.outputs.due == 'true'
        run: python -m unittest discover -s tests -q
      - name: Collect public and institutional REITs together
        if: steps.freshness.outputs.due == 'true'
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE_REFRESH" = true ]; then
            python scripts/refresh_all.py --run-id '${{ github.run_id }}-${{ github.run_attempt }}' --force
          else
            python scripts/refresh_all.py --run-id '${{ github.run_id }}-${{ github.run_attempt }}'
          fi
      - name: Commit the complete pair
        if: steps.freshness.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/institutional.json data/public_reits.json data/refresh_status.json data/raw/daily_refresh/ data/source_manifest/ workpapers/daily_refresh/ snapshots/public/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public and institutional REITs together"
            git push
          fi
      - name: Keep source evidence and validation even after failure
        if: always() && steps.freshness.outputs.due == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reits-daily-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/daily_refresh/${{ github.run_id }}-${{ github.run_attempt }}/
            workpapers/daily_refresh/${{ github.run_id }}-${{ github.run_attempt }}/
            data/source_manifest/daily_refresh/${{ github.run_id }}-${{ github.run_attempt }}.json
          retention-days: 30
